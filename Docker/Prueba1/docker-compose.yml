services:
  # Servicio de base de datos PostgreSQL
  db:
    image: postgres:16        # Usamos la imagen oficial de PostgreSQL versión 16
    env_file:
      - .env                  # Lee las variables de entorno desde el archivo .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
                              # Monta el volumen postgres_data en la carpeta donde
                              # PostgreSQL guarda sus datos, para persistirlos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
                              # Comando que comprueba si PostgreSQL está listo
                              # pg_isready es una herramienta oficial de PostgreSQL
      interval: 5s            # Repite la comprobación cada 5 segundos
      retries: 5              # Si falla 5 veces seguidas, marca el servicio como unhealthy

  # Servicio de la API
  api:
    build: .                  # Construye la imagen usando el Dockerfile de esta carpeta
    ports:
      - "5000:5000"           # Mapea el puerto 5000 del host al puerto 5000 del contenedor
    env_file:
      - .env                  # Lee las variables de entorno desde el archivo .env
    depends_on:
      db:
        condition: service_healthy
                              # No arranca la API hasta que db pase el healthcheck
                              # Evita que la API intente conectarse antes de que PostgreSQL esté listo

# Declaración de volúmenes con nombre gestionados por Docker
volumes:
  postgres_data:              # Docker gestiona dónde se guardan los datos en el host